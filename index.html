<!DOCTYPE html>
<html lang="ko">
<head>

    <!-- 구글 태그 끝 -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETA & Strategy Media Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 글로벌 배경 블러 효과 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-violet-600/15 rounded-full blur-3xl"></div>
    </div>

    <!-- 상단 네비게이션 헤더 -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-violet-500 to-amber-500 p-0.5 shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <!-- 팟캐스트/오디오 아이콘 -->
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-lg font-bold tracking-tight text-white group-hover:text-indigo-400 transition-colors">etaclub.kr</span>
                        <span class="text-[10px] font-semibold tracking-wide uppercase px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Media</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-medium">ETA & Strategy Curation</p>
                </div>
            </a>

            <!-- 헤더 우측 라이브 인디케이터 -->
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/60 border border-slate-700/50 text-xs font-medium text-slate-300">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span>Live Channels</span>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full">
        <!-- 히어로 헤더 섹션 -->
        <div class="mb-10 text-center sm:text-left relative">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold mb-4">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"></path>
                </svg>
                ETA &amp; 인수창업 미디어 허브
            </div>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight">
                Media &amp; Podcast Channels
            </h2>
            <p class="mt-3 text-base text-slate-400 max-w-2xl leading-relaxed">
                기업 전략, 인수창업(ETA), 서치펀드 분야의 인사이트를 담은 검증된 미디어 채널을 엄선하여 제공합니다.
            </p>
        </div>

        <!-- 동적 주입될 채널 카드 컨테이너 -->
        <div id="channel-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- script.js에 의해 이곳에 동적으로 주입됩니다 -->
        </div>
    </main>

    <!-- 하단 미디어 푸터 -->
    <footer class="mt-20 border-t border-slate-800/80 bg-slate-900/40 backdrop-blur-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                </svg>
                <span>© 2026 etaclub.kr. All rights reserved.</span>
            </div>
            <p>Curated for Entrepreneurs &amp; Investors</p>
        </div>
    </footer>

    <!-- 동적 흐름을 제어할 백엔드 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
